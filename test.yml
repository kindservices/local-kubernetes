apiVersion: batch/v1
kind: Job
metadata:
  name: kubectl-job
spec:
  template:
    spec:
      containers:
      - name: kubectl-container
        image: bitnami/kubectl:1.21.0
        command: ["/bin/sh", "-c"]
        args:
          - |
            echo "Listing all pods in the default namespace:";
            kubectl get pods -n default;
        env:
        - name: KUBERNETES_SERVICE_HOST
          valueFrom:
            fieldRef:
              fieldPath: status.hostIP
        - name: KUBERNETES_SERVICE_PORT
          valueFrom:
            fieldRef:
              fieldPath: status.hostPort
      restartPolicy: OnFailure
  backoffLimit: 4

