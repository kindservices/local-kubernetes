apiVersion: v1
kind: ConfigMap
metadata:
  name: kubeconfig
data:
  config: |
    # This is an example config file
    key1: value1
    key2: value2

---

apiVersion: batch/v1
kind: Job
metadata:
  name: install-argocd
spec:
  template:
    spec:
      containers:
      - name: install-argocd
        image: bitnami/kubectl:1.21.0
        command: ["/bin/sh", "-c"]
        args:
          - |
            # Create the argocd namespace
            kubectl create namespace argocd || true
            # Install ArgoCD
            kubectl apply -n argocd -f https://raw.githubusercontent.com/argoproj/argo-cd/stable/manifests/install.yaml
        env:
          - name: KUBECONFIG
            value: /root/.kube/config
        volumeMounts:
        - name: kubeconfig
          mountPath: /root/.kube
          readOnly: true
      restartPolicy: OnFailure
      volumes:
      - name: kubeconfig
        configMap:
          name: kubeconfig
  backoffLimit: 5