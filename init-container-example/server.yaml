apiVersion: apps/v1
kind: Deployment
metadata:
  name: test-deploy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: env-app
  template:
    metadata:
      labels:
        app: env-app
    spec:
      initContainers:
      - name: init-environment
        image: busybox
        command: ['sh', '-c', 'echo secretValue123 > /secrets/SecretKey']
        envFrom:
        - configMapRef:
            name: env-config
        volumeMounts:
        - name: config-volume
          mountPath: /secrets
      containers:
      - name: web
        image: docker.io/kindservices/node-env:local
        command: ['sh', '-c', 'export HACK=$(cat /secrets/SecretKey) && node server.js']
        env:
        - name: FOO
          valueFrom:
            configMapKeyRef:
              name: env-config
              key: SecretKey
        ports:
        - containerPort: 3000
        volumeMounts:
        - name: config-volume
          mountPath: /secrets
      volumes:
      - name: config-volume
        emptyDir: {}

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: env-config
data:
  FOO: "bar"

---
apiVersion: v1
kind: Service
metadata:
  name: env-service
spec:
  selector:
    app: env-app
  ports:
    - protocol: TCP
      port: 3000
      targetPort: 3000
  type: LoadBalancer


