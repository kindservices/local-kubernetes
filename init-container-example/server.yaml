apiVersion: v1
kind: ConfigMap
metadata:
  name: env-config
data:
  FOO: "bar"

---
apiVersion: v1
kind: Pod
metadata:
  name: env-pod
spec:
  initContainers:
  - name: init-environment
    image: busybox
    command: ['sh', '-c', 'echo $(FOO) > /foo/FOO']
    envFrom:
    - configMapRef:
        name: env-config
    volumeMounts:
    - name: foo-volume
      mountPath: /foo

  containers:
  - name: web
    image: node:14
    command: ['node', 'server.js']
    env:
    - name: FOO
      valueFrom:
        configMapKeyRef:
          name: env-config
          key: FOO
    ports:
    - containerPort: 3000
    volumeMounts:
    - name: foo-volume
      mountPath: /foo

  volumes:
  - name: foo-volume
    emptyDir: {}
