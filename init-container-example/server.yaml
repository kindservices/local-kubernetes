apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      initContainers:
      - name: init-secret
        image: busybox
        command: ['sh', '-c', 'echo somesecret > /mnt/secret/secret']
        volumeMounts:
        - name: secret-volume
          mountPath: /mnt/secret
      containers:
      - name: web
        image: docker.io/kindservices/node-env:local
        command: ['sh', '-c', 'export HACK=$(cat /mnt/secret/secret) && node server.js']
        ports:
        - containerPort: 3000
        env:
        - name: SECRET
          valueFrom:
            secretKeyRef:
              name: web-secret
              key: secret
        volumeMounts:
        - name: secret-volume
          mountPath: /mnt/secret
      volumes:
      - name: secret-volume
        emptyDir: {}
---
apiVersion: v1
kind: Secret
metadata:
  name: web-secret
type: Opaque
data:
  secret: bXlzZWNyZXQ= # 'mysecret' base64 encoded
